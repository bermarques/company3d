name: Build

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check syntax
        run: find server.js scripts public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Start the web app
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/healthz > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Smoke test
        run: node scripts/smoke.js http://127.0.0.1:3000

      - name: Server log
        if: always()
        run: cat server.log || true
